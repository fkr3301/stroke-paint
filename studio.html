<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一笔一画 · 一键生成</title>
<style>
  :root{--bg:#ECEDE8;--card:#FBFBF8;--line:#DBDDD4;--ink:#22231D;--mut:#8C8E83;--acc:#C6401D}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:20px 34px 14px;border-bottom:1px solid var(--line)}
  .brand{font-family:Georgia,'Songti SC','Noto Serif SC',serif;font-size:22px;letter-spacing:3px}
  .brand .sub{font:10px/1 ui-monospace,Consolas,monospace;letter-spacing:3px;color:var(--mut);margin-left:12px}
  .meta{font:10px/1 ui-monospace,Consolas,monospace;letter-spacing:2px;color:var(--mut)}
  main{flex:1;min-height:0;display:flex;flex-direction:column}
  #stage{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
  .panel{width:100%;max-width:820px;background:var(--card);border:1px solid var(--line);box-shadow:0 12px 34px rgba(30,32,25,.07);padding:22px}
  .drop{display:block;border:2px dashed #CFD1C6;background:#fff;padding:44px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
  .drop.over{border-color:var(--acc);background:#fff8f4}
  .drop b{display:block;font-family:Georgia,'Songti SC',serif;font-size:20px;letter-spacing:2px;margin-bottom:8px}
  .drop span{display:block;font:11px/1.8 ui-monospace,Consolas,monospace;color:var(--mut);letter-spacing:1px}
  .opts{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-top:18px}
  .opts label{display:flex;flex-direction:column;gap:5px;font:10px/1 ui-monospace,Consolas,monospace;letter-spacing:2px;color:var(--mut)}
  .opts select,.opts input{font:13px system-ui,sans-serif;color:var(--ink);background:#fff;border:1px solid var(--line);padding:7px 9px;min-width:96px}
  .opts input{min-width:170px}
  .opts .sp{flex:1}
  button{font:12px/1 system-ui,sans-serif;letter-spacing:1px;cursor:pointer;padding:10px 16px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  button:hover{background:#f1f2ec}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 5px 14px rgba(198,64,29,.32)}
  button.primary:hover{filter:brightness(1.06)}
  .ghost{color:var(--mut)}
  .hint{margin:16px 0 0;font:11px/1.7 ui-monospace,Consolas,monospace;color:var(--mut);letter-spacing:1px}
  #busy .spin{width:34px;height:34px;margin:0 auto 16px;border:3px solid #DADCD2;border-top-color:var(--acc);border-radius:50%;animation:sp 900ms linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #status{text-align:center;font:12px/1.8 ui-monospace,Consolas,monospace;color:var(--mut);letter-spacing:1px;word-break:break-word}
  #status.err{color:var(--acc)}
  #out{flex:1;min-height:0;display:flex;flex-direction:column}
  .toolbar{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card)}
  #stats{font:11px/1 ui-monospace,Consolas,monospace;color:var(--mut);letter-spacing:1px}
  .toolbar .sp{flex:1}
  #frame{flex:1;width:100%;border:0;background:#fff}
  [hidden]{display:none !important}
  @media (max-width:760px){
    header{padding:16px 18px 12px}
    .panel{padding:16px}
    .drop{padding:30px 14px}
    .opts{gap:10px}
    .opts input{min-width:120px}
  }
</style>
</head>
<body>
<header>
  <div class="brand">一笔一画<span class="sub">STROKE STUDIO</span></div>
  <div class="meta">LOCAL · NO UPLOAD · NO INSTALL</div>
</header>
<main>
  <div id="stage">
    <section class="panel" id="input">
      <label class="drop" id="drop">
        <input type="file" id="file" accept="image/*" hidden>
        <b>拖一张图片进来</b>
        <span>或点击选择文件 · Ctrl / ⌘ + V 粘贴 · JPG / PNG / WebP / GIF / AVIF</span>
      </label>
      <div class="opts">
        <label>精细度
          <select id="preset">
            <option value="quick">快速（轻）</option>
            <option value="normal" selected>标准</option>
            <option value="fine">精细（慢）</option>
          </select>
        </label>
        <label>播放时长
          <select id="seconds">
            <option value="60">60 秒</option>
            <option value="100" selected>100 秒</option>
            <option value="150">150 秒</option>
          </select>
        </label>
        <label>标题
          <input id="title" value="一笔一画" maxlength="24" spellcheck="false">
        </label>
        <span class="sp"></span>
        <button id="demo" class="ghost">用示例图试试</button>
      </div>
      <p class="hint">整条流水线就在这个页面里跑：图片不会上传到任何服务器，断网也能用。生成后可以下载成一个独立 HTML 发给别人。</p>
    </section>

    <section class="panel" id="busy" hidden>
      <div class="spin"></div>
      <div id="status">读取图片…</div>
    </section>
  </div>

  <section id="out" hidden>
    <div class="toolbar">
      <span id="stats"></span>
      <span class="sp"></span>
      <button id="dl" class="primary">下载 paint.html</button>
      <button id="again" class="ghost">再画一张</button>
    </div>
    <iframe id="frame" title="painting preview"></iframe>
  </section>
</main>

<script>
'use strict';
/*
 * stroke-paint core — the whole painting pipeline, platform-free.
 *
 * Input : an RGBA buffer (any size) + a few options.
 * Output: the stroke packet that the player consumes.
 *
 * No Node APIs, no DOM: scripts/paint.js runs it under Node, studio.html inlines it
 * in the browser, so both produce byte-identical strokes for the same pixels.
 */

// area-average downscale of an RGBA buffer
function resizeRGBA(src, sw, sh, dw, dh) {
  const out = new Uint8Array(dw * dh * 4);
  const sx = sw / dw, sy = sh / dh;
  for (let y = 0; y < dh; y++) {
    const y0 = Math.floor(y * sy), y1 = Math.max(y0 + 1, Math.min(sh, Math.floor((y + 1) * sy)));
    for (let x = 0; x < dw; x++) {
      const x0 = Math.floor(x * sx), x1 = Math.max(x0 + 1, Math.min(sw, Math.floor((x + 1) * sx)));
      let r = 0, g = 0, b = 0, a = 0, n = 0;
      for (let yy = y0; yy < y1; yy++) {
        const rowBase = yy * sw * 4;
        for (let xx = x0; xx < x1; xx++) {
          const i = rowBase + xx * 4;
          r += src[i]; g += src[i + 1]; b += src[i + 2]; a += src[i + 3]; n++;
        }
      }
      const o = (y * dw + x) * 4;
      out[o] = r / n; out[o + 1] = g / n; out[o + 2] = b / n; out[o + 3] = a / n;
    }
  }
  return out;
}

const LAYER_SPEED = [1500, 1200, 1000, 850, 650, 2000]; // px per second, per layer

/**
 * paintCore({ rgba, srcW, srcH, width, layers, seconds, names, log })
 *   rgba    Uint8Array RGBA at srcW x srcH
 *   width   analysis width in px (the source is never upscaled)
 *   layers  highest layer to build, 0..5
 *   seconds target timeline length at 1x
 *   names   optional "a|b|c|d|e|f"
 *   log     optional (msg) => void
 * returns { packet, meta, counts, skinFrac, focusFrac, skinPrimary }
 */
function paintCore(opts) {
  const say = typeof opts.log === 'function' ? opts.log : () => {};
  const useScale = opts.noScale !== true;      // width follows local feature scale
  const useEdgeStop = opts.noEdgeStop !== true; // strokes stop at hard luminance steps
  const useCoreColor = opts.avgColor !== true;  // trimmed-mean colour instead of mean
  const rgba = opts.rgba;
  const SW = opts.srcW, SH = opts.srcH;
  const MAXL = Math.max(0, Math.min(5, opts.layers == null ? 5 : opts.layers));
  const seconds = opts.seconds > 0 ? opts.seconds : 100;

  const AW = Math.max(16, Math.min(opts.width || 640, SW));
  const W = AW, H = Math.max(2, Math.round(SH * (AW / SW)));
  const N = W * H;
  if (N > 4.2e6) throw new Error(`analysis grid too large (${W}x${H}), lower the width`);

  // ---- flat RGB at analysis size, alpha flattened onto white paper ----
  const px = resizeRGBA(rgba, SW, SH, W, H);
  const R = new Float32Array(N), G = new Float32Array(N), B = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const k = px[i * 4 + 3] / 255;
    R[i] = (px[i * 4] * k + 255 * (1 - k)) / 255;
    G[i] = (px[i * 4 + 1] * k + 255 * (1 - k)) / 255;
    B[i] = (px[i * 4 + 2] * k + 255 * (1 - k)) / 255;
  }

  // ---- colour spaces ----
  const L = new Float32Array(N), S = new Float32Array(N), V = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    L[i] = 0.2126 * R[i] + 0.7152 * G[i] + 0.0722 * B[i];
    const mx = Math.max(R[i], G[i], B[i]), mn = Math.min(R[i], G[i], B[i]);
    V[i] = mx; S[i] = mx > 1e-6 ? (mx - mn) / mx : 0;
  }

  // ---- separable box blur ----
  function box(src, r) {
    const t = new Float32Array(N), o = new Float32Array(N);
    for (let y = 0; y < H; y++) {
      let acc = 0;
      for (let x = -r; x <= r; x++) acc += src[y * W + Math.min(W - 1, Math.max(0, x))];
      for (let x = 0; x < W; x++) {
        o[y * W + x] = acc / (2 * r + 1);
        acc += src[y * W + Math.min(W - 1, x + r + 1)] - src[y * W + Math.max(0, x - r)];
      }
    }
    for (let x = 0; x < W; x++) {
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += o[Math.min(H - 1, Math.max(0, y)) * W + x];
      for (let y = 0; y < H; y++) {
        t[y * W + x] = acc / (2 * r + 1);
        acc += o[Math.min(H - 1, y + r + 1) * W + x] - o[Math.max(0, y - r) * W + x];
      }
    }
    return t;
  }

  // ---- gradients / local contrast ----
  const gx = new Float32Array(N), gy = new Float32Array(N);
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    const i = y * W + x;
    gx[i] = (L[i - W + 1] + 2 * L[i + 1] + L[i + W + 1]) - (L[i - W - 1] + 2 * L[i - 1] + L[i + W - 1]);
    gy[i] = (L[i + W - 1] + 2 * L[i + W] + L[i + W + 1]) - (L[i - W - 1] + 2 * L[i - W] + L[i - W + 1]);
  }
  const mag = new Float32Array(N);
  for (let i = 0; i < N; i++) mag[i] = Math.hypot(gx[i], gy[i]);
  const D = box(mag, 2); // smoothed local contrast = "how much detail lives here"

  // ---- structure tensor -> stroke direction (along edges) ----
  const Jxx = box(Float32Array.from(gx, v => v * v), 3);
  const Jyy = box(Float32Array.from(gy, v => v * v), 3);
  const Jxy = box(Float32Array.from(gx, (v, i) => v * gy[i]), 3);
  const coh = new Float32Array(N), edgeA = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const tr = (Jxx[i] + Jyy[i]) / 2, dd = Math.hypot((Jxx[i] - Jyy[i]) / 2, Jxy[i]);
    const l1 = tr + dd, l2 = Math.max(0, tr - dd);
    coh[i] = l1 / (l1 + l2 + 1e-7);
    edgeA[i] = 0.5 * Math.atan2(2 * Jxy[i], Jxx[i] - Jyy[i]) + Math.PI / 2; // along-edge
  }
  // smooth flow field so flat regions still get a believable stroke grain
  const fgx = box(gx, 12), fgy = box(gy, 12);
  let dirx = new Float32Array(N), diry = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const fm = Math.hypot(fgx[i], fgy[i]);
    let a;
    if (coh[i] > 0.3 && D[i] > 0.02) a = edgeA[i];
    else if (fm > 0.004) a = Math.atan2(fgy[i], fgx[i]) + Math.PI / 2;
    else a = -0.6 + 0.25 * Math.sin((i % W) * 0.011) + 0.2 * Math.sin(Math.floor(i / W) * 0.013);
    dirx[i] = Math.cos(a); diry[i] = Math.sin(a);
  }
  dirx = box(dirx, 2); diry = box(diry, 2);
  function dirAt(x, y) {
    const xi = Math.min(W - 1, Math.max(0, Math.round(x))), yi = Math.min(H - 1, Math.max(0, Math.round(y)));
    return Math.atan2(diry[yi * W + xi], dirx[yi * W + xi]);
  }

  // ---- tone x saturation cells -> stroke length modulation ----
  const regionLen = new Float32Array(12);
  {
    const sum = new Float32Array(12), cnt = new Float32Array(12);
    for (let i = 0; i < N; i++) {
      const lab = Math.min(3, (L[i] * 4) | 0) * 3 + Math.min(2, (S[i] * 3) | 0);
      sum[lab] += D[i]; cnt[lab]++;
    }
    const mean = Array.from(sum, (s, i) => (cnt[i] ? s / cnt[i] : 0));
    const avg = mean.reduce((a, b) => a + b, 0) / 12;
    for (let i = 0; i < 12; i++) regionLen[i] = mean[i] < avg * 0.6 ? 1.25 : mean[i] > avg * 1.4 ? 0.8 : 1.0;
  }
  function regionScale(x, y) {
    const i = (y | 0) * W + (x | 0);
    return regionLen[Math.min(3, (L[i] * 4) | 0) * 3 + Math.min(2, (S[i] * 3) | 0)];
  }

  // ---- detail percentiles ----
  const sorted = Float64Array.from(D).sort();
  const pct = p => sorted[Math.min(N - 1, Math.max(0, (p * N) | 0))];
  const P = { 50: pct(0.5), 65: pct(0.65), 72: pct(0.72), 88: pct(0.88), 90: pct(0.90), 93: pct(0.93), 99: pct(0.99) };
  if (P[99] < 0.004) say('warning: the picture is almost flat (no local contrast) — the strokes will look like plain colour fills.');

  // ---- is there paper (a bright, empty ground) within ~13px? ----
  // Thresholds "ink on paper" images (line art, text, screenshots, blown highlights)
  // where the brush must be ink-thin, from photographs where a wide brush is correct.
  const Lmax13 = (() => {
    const tmp = new Float32Array(N), out = new Float32Array(N);
    const r = 6;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        let m = 0;
        for (let k = -r; k <= r; k++) { const v = L[y * W + Math.min(W - 1, Math.max(0, x + k))]; if (v > m) m = v; }
        tmp[y * W + x] = m;
      }
    }
    for (let x = 0; x < W; x++) {
      for (let y = 0; y < H; y++) {
        let m = 0;
        for (let k = -r; k <= r; k++) { const v = tmp[Math.min(H - 1, Math.max(0, y + k)) * W + x]; if (v > m) m = v; }
        out[y * W + x] = m;
      }
    }
    return out;
  })();
  // ---- local peak-to-peak luminance in a 5x5 window ----
  // A real hairline is a step of ~0.9 in luminance; film grain is ~0.02, and a soft
  // gradient is ~0.05. Percentiles of any derivative always let ~10% of the image
  // through, so "is this a genuine hard edge" has to be an absolute test.
  const stepMap = (() => {
    const out = new Float32Array(N);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let lo = 1e9, hi = -1e9;
      for (let dy = -2; dy <= 2; dy++) {
        const yy = Math.min(H - 1, Math.max(0, y + dy)) * W;
        for (let dx = -2; dx <= 2; dx++) {
          const v = L[yy + Math.min(W - 1, Math.max(0, x + dx))];
          if (v < lo) lo = v;
          if (v > hi) hi = v;
        }
      }
      out[y * W + x] = hi - lo;
    }
    return out;
  })();

  // ---- local feature scale: distance to the nearest HARD edge ----
  // A hairline must not be painted with a 24px brush, while an open field keeps its
  // full width. Seeding on the absolute step (not on a detail percentile) is what keeps
  // this inert on soft, grainy photographs and active on ink, text and blown highlights.
  const detailScaleAt = (() => {
    const INF = 1e7;
    const d = new Float32Array(N);
    for (let i = 0; i < N; i++) d[i] = stepMap[i] > 0.30 ? 0 : INF;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x;
      let v = d[i];
      if (x > 0) v = Math.min(v, d[i - 1] + 3);
      if (y > 0) {
        v = Math.min(v, d[i - W] + 3);
        if (x > 0) v = Math.min(v, d[i - W - 1] + 4);
        if (x < W - 1) v = Math.min(v, d[i - W + 1] + 4);
      }
      d[i] = v;
    }
    for (let y = H - 1; y >= 0; y--) for (let x = W - 1; x >= 0; x--) {
      const i = y * W + x;
      let v = d[i];
      if (x < W - 1) v = Math.min(v, d[i + 1] + 3);
      if (y < H - 1) {
        v = Math.min(v, d[i + W] + 3);
        if (x < W - 1) v = Math.min(v, d[i + W + 1] + 4);
        if (x > 0) v = Math.min(v, d[i + W - 1] + 4);
      }
      d[i] = v;
    }
    for (let i = 0; i < N; i++) d[i] = d[i] >= INF ? 40 : d[i] / 3;
    // A brush must never be wider than the ink it sits on: inside a 6px black line the
    // nearest hard edge is 3px away, so the ink is ~6px and a 24px brush is scaled to 6.
    // In open areas (no hard edge nearby) this returns 1 and nothing changes at all.
    return (x, y, base) => {
      const i = Math.min(H - 1, Math.max(0, y | 0)) * W + Math.min(W - 1, Math.max(0, x | 0));
      const ink = 2 * d[i];
      const limit = Math.min(1, Math.max(0.18, ink / Math.max(1e-6, base)));
      // Only honour the ink width on paper-like ground. In a dark or mid-tone area a wide
      // brush is the correct underpainting; shrinking it there just leaves white gaps.
      const paper = Math.min(1, Math.max(0, (Lmax13[i] - 0.80) / 0.12));
      return 1 - paper * (1 - limit);
    };
  })();



  // ---- sampling helpers ----
  const sampleRGB = (x, y) => {
    const i = Math.min(H - 1, Math.max(0, y | 0)) * W + Math.min(W - 1, Math.max(0, x | 0));
    return [R[i], G[i], B[i]];
  };
  function discRGB(x, y, r) {
    // trimmed mean over the disc: a disc straddling a hard edge takes the tone of the
    // dominant side instead of averaging black and white into a grey halo
    const cs = [], ls = [];
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (dx * dx + dy * dy > r * r) continue;
      const c = sampleRGB(x + dx, y + dy);
      cs.push(c); ls.push(0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]);
    }
    const order = ls.map((v, i) => [v, i]).sort((a, b) => a[0] - b[0]);
    const lo = Math.floor(order.length * 0.2), hi = Math.max(lo + 1, Math.ceil(order.length * 0.8));
    let r0 = 0, g0 = 0, b0 = 0, n = 0;
    for (let k = lo; k < hi; k++) { const c = cs[order[k][1]]; r0 += c[0]; g0 += c[1]; b0 += c[2]; n++; }
    return [r0 / n, g0 / n, b0 / n];
  }
  function pathRGB(pts) {
    let r0 = 0, g0 = 0, b0 = 0;
    for (const p of pts) { const c = sampleRGB(p[0], p[1]); r0 += c[0]; g0 += c[1]; b0 += c[2]; }
    return [r0 / pts.length, g0 / pts.length, b0 / pts.length];
  }
  const lumAt = (x, y) => {
    const i = Math.min(H - 1, Math.max(0, y | 0)) * W + Math.min(W - 1, Math.max(0, x | 0));
    return L[i];
  };
  // Colour of a stroke = trimmed mean by luminance. A stroke lying partly on black and
  // partly on white then keeps the tone of the side it actually covers instead of
  // averaging to grey — this is what stops hard edges turning to mud.
  function coreRGB(pts) {
    const cs = [], ls = [];
    for (const p of pts) {
      const c = sampleRGB(p[0], p[1]);
      cs.push(c); ls.push(0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]);
    }
    const order = ls.map((v, i) => [v, i]).sort((a, b) => a[0] - b[0]);
    const lo = Math.floor(order.length * 0.25), hi = Math.max(lo + 1, Math.ceil(order.length * 0.75));
    let r0 = 0, g0 = 0, b0 = 0, n = 0;
    for (let k = lo; k < hi; k++) { const c = cs[order[k][1]]; r0 += c[0]; g0 += c[1]; b0 += c[2]; n++; }
    return [r0 / n, g0 / n, b0 / n];
  }
  const hex = c => '#' + c.map(v => Math.round(Math.min(255, Math.max(0, v * 255))).toString(16).padStart(2, '0')).join('');

  // ---- walking strokes along the direction field ----
  function walk(x, y, len, ds = 3, jump = 0.26) {
    const pts = [], back = [];
    let cx = x, cy = y;
    let prevL = lumAt(cx, cy);
    for (let s = 0; s < len / 2; s += ds) {
      const a = dirAt(cx, cy);
      const nx = cx - Math.cos(a) * ds, ny = cy - Math.sin(a) * ds;
      if (nx < 1 || ny < 1 || nx > W - 2 || ny > H - 2) break;
      const l = lumAt(nx, ny);
      if (useEdgeStop && jump > 0 && Math.abs(l - prevL) > jump) break; // don't paint across a hard edge
      prevL = l;
      cx = nx; cy = ny;
      back.push([cx, cy]);
    }
    for (let i = back.length - 1; i >= 0; i--) pts.push(back[i]);
    pts.push([x, y]);
    cx = x; cy = y;
    prevL = lumAt(cx, cy);
    for (let s = 0; s < len / 2; s += ds) {
      const a = dirAt(cx, cy);
      const nx = cx + Math.cos(a) * ds, ny = cy + Math.sin(a) * ds;
      if (nx < 1 || ny < 1 || nx > W - 2 || ny > H - 2) break;
      const l = lumAt(nx, ny);
      if (useEdgeStop && jump > 0 && Math.abs(l - prevL) > jump) break;
      prevL = l;
      cx = nx; cy = ny;
      pts.push([cx, cy]);
    }
    return pts;
  }
  function toPath(pts) {
    const keep = [pts[0]];
    for (let i = 1; i < pts.length - 1; i++) {
      const a = keep[keep.length - 1], b = pts[i], c = pts[i + 1];
      const a1 = Math.atan2(b[1] - a[1], b[0] - a[0]), a2 = Math.atan2(c[1] - b[1], c[0] - b[0]);
      let da = Math.abs(a1 - a2); if (da > Math.PI) da = 2 * Math.PI - da;
      if (da > 0.18) keep.push(b);
    }
    keep.push(pts[pts.length - 1]);
    const f = v => Math.round(v * 10) / 10;
    return 'M' + keep.map(p => f(p[0]) + ' ' + f(p[1])).join('L');
  }
  function polyLen(pts) {
    let l = 0;
    for (let i = 1; i < pts.length; i++) l += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    return Math.max(1, l);
  }

  const layers = [[], [], [], [], [], []];
  const rnd = (a => () => (a = (a * 1664525 + 1013904223) >>> 0) / 4294967296)(42);

  // ---- L0..L2: painterly grids, coarse to fine ----
  function painterLayer(li, step, width, lenMin, lenMax, thr, cr) {
    const out = layers[li];
    for (let gy0 = step / 2; gy0 < H; gy0 += step) {
      for (let gx0 = step / 2; gx0 < W; gx0 += step) {
        const x = gx0 + (rnd() - 0.5) * step * 0.7, y = gy0 + (rnd() - 0.5) * step * 0.7;
        const xi = x | 0, yi = y | 0;
        if (xi < 1 || yi < 1 || xi >= W - 1 || yi >= H - 1) continue;
        if (D[yi * W + xi] < thr) continue;
        const rs = regionScale(xi, yi);
        const len = (lenMin + rnd() * (lenMax - lenMin)) * rs;
        const pts = walk(x, y, len);
        if (pts.length < 2) continue;
        const sc = useScale ? detailScaleAt(x, y, width) : 1;
        const col = li === 0 ? discRGB(x, y, Math.max(2, Math.round(cr * sc))) : (useCoreColor ? coreRGB(pts) : pathRGB(pts));
        out.push({ d: toPath(pts), c: hex(col), w: Math.max(0.6, width * (0.85 + rnd() * 0.3) * sc), o: 1, len: polyLen(pts), x, y });
      }
    }
  }
  painterLayer(0, 16, 24, 30, 44, 0, 7);
  painterLayer(1, 10, 8.5, 11, 18, P[65], 4);
  painterLayer(2, 6, 4.2, 6, 12, P[88], 2.5);

  // ---- L3: contour lines traced along ridges of local contrast ----
  {
    const vis = new Uint8Array(N);
    const out = layers[3];
    const tSeed = P[93], tKeep = P[88];
    for (let y = 2; y < H - 2; y++) for (let x = 2; x < W - 2; x++) {
      const i = y * W + x;
      if (vis[i] || D[i] < tSeed) continue;
      const pts = [];
      for (const sgn of [-1, 1]) {
        let cx = x, cy = y; const arm = [];
        for (let s = 0; s < 40; s += 1.5) {
          const ci = (cy | 0) * W + (cx | 0);
          if (D[ci] < tKeep) break;
          for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
            vis[Math.min(N - 1, Math.max(0, ci + dy * W + dx))] = 1;
          }
          const a = edgeA[ci];
          cx += Math.cos(a) * 1.5 * sgn; cy += Math.sin(a) * 1.5 * sgn;
          if (cx < 2 || cy < 2 || cx > W - 3 || cy > H - 3) break;
          arm.push([cx, cy]);
        }
        if (sgn === -1) { arm.reverse(); pts.push(...arm); } else pts.push(...arm);
      }
      if (polyLen(pts) < 7) continue;
      // sample the darker side of the ridge -> ink colour
      const cols = [];
      for (const p of pts) {
        const i2 = (p[1] | 0) * W + (p[0] | 0);
        const a = edgeA[i2] + Math.PI / 2, nx = Math.cos(a) * 1.4, ny = Math.sin(a) * 1.4;
        const c1 = sampleRGB(p[0] + nx, p[1] + ny), c2 = sampleRGB(p[0] - nx, p[1] - ny);
        const l1 = 0.2126 * c1[0] + 0.7152 * c1[1] + 0.0722 * c1[2];
        const l2 = 0.2126 * c2[0] + 0.7152 * c2[1] + 0.0722 * c2[2];
        cols.push(l1 < l2 ? c1 : c2);
      }
      const col = cols.reduce((a, c) => [a[0] + c[0] / cols.length, a[1] + c[1] / cols.length, a[2] + c[2] / cols.length], [0, 0, 0]);
      const w0 = 1.2 + Math.min(1.6, (D[i] - tSeed) / Math.max(1e-6, P[99] - tSeed) * 1.6);
      const w = w0 * (useScale ? detailScaleAt(x, y, w0) : 1);
      out.push({ d: toPath(pts), c: hex(col), w: Math.max(0.6, w), o: 0.95, len: polyLen(pts), x, y });
    }
  }

  // ---- skin mask (portrait detection) ----
  function binBlur(m, r, thr) {
    const f = box(Float32Array.from(m), r), o = new Uint8Array(N);
    for (let i = 0; i < N; i++) o[i] = f[i] > thr ? 1 : 0;
    return o;
  }
  let skin = new Uint8Array(N);
  for (let i = 0; i < N; i++) {
    skin[i] = (R[i] > 0.5 && (R[i] - G[i]) > 0.05 && (R[i] - B[i]) > 0.04 && S[i] > 0.06 && S[i] < 0.5 && V[i] > 0.5) ? 1 : 0;
  }
  skin = binBlur(skin, 2, 0.35);
  skin = binBlur(skin, 2, 0.5);
  { // fill holes: flood the background in from the border
    const bg = new Uint8Array(N), st = [];
    for (let x = 0; x < W; x++) { if (!skin[x]) { bg[x] = 1; st.push(x); } const i = (H - 1) * W + x; if (!skin[i]) { bg[i] = 1; st.push(i); } }
    for (let y = 0; y < H; y++) {
      const a = y * W, b = y * W + W - 1;
      if (!skin[a]) { bg[a] = 1; st.push(a); }
      if (!skin[b]) { bg[b] = 1; st.push(b); }
    }
    while (st.length) {
      const i = st.pop(), x = i % W, y = (i / W) | 0;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        const j = ny * W + nx;
        if (!skin[j] && !bg[j]) { bg[j] = 1; st.push(j); }
      }
    }
    for (let i = 0; i < N; i++) if (!skin[i] && !bg[i]) skin[i] = 1;
  }
  { // drop specks smaller than 150px, then soften edges
    const seen = new Uint8Array(N);
    for (let s = 0; s < N; s++) {
      if (!skin[s] || seen[s]) continue;
      const comp = [s]; seen[s] = 1;
      for (let k = 0; k < comp.length; k++) {
        const i = comp[k], x = i % W, y = (i / W) | 0;
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
          const j = ny * W + nx;
          if (skin[j] && !seen[j]) { seen[j] = 1; comp.push(j); }
        }
      }
      if (comp.length < 150) for (const i of comp) skin[i] = 0;
    }
    skin = binBlur(skin, 2, 0.25);
  }
  const skinCount = skin.reduce((a, b) => a + b, 0);
  const skinFrac = skinCount / N;

  // ---- focus mask: faces/hands when present, plus the busiest detail areas ----
  // A portrait's focal area is the skin mask; for everything else it is where the
  // detail actually lives. The layer's stroke count is bounded separately (see
  // L4_CAP below), so this mask can afford to be generous.
  const skinPrimary = skinFrac > 0.004 && skinFrac <= 0.08;
  let focus = new Uint8Array(N), focusFrac = 0;
  {
    const thr = pct(0.95);
    let c = 0;
    for (let i = 0; i < N; i++) {
      const v = skin[i] || D[i] > thr ? 1 : 0;
      focus[i] = v; c += v;
    }
    focusFrac = c / N;
  }
  focus = binBlur(focus, 1, 0.3);

  // ---- L4: dense short strokes over the focus mask ----
  // 2.6px / 2.2px spacing is the design density that makes eyes and edges crisp.
  // If that density would produce an unwieldy page, coarsen the spacing instead of
  // dropping coverage (dropping it just makes faces look smudged).
  const L4_CAP = 18000;
  function buildFocusStrokes(sCoarse, sFine) {
    const out = [];
    for (let gy0 = sCoarse * 0.6; gy0 < H; gy0 += sCoarse) {
      for (let gx0 = sCoarse * 0.6; gx0 < W; gx0 += sCoarse) {
        const x = gx0 + (rnd() - 0.5) * 2, y = gy0 + (rnd() - 0.5) * 2;
        const xi = x | 0, yi = y | 0;
        if (xi < 1 || yi < 1 || xi >= W - 1 || yi >= H - 1 || !focus[yi * W + xi]) continue;
        const pts = walk(x, y, 4 + rnd() * 3, 2);
        if (pts.length < 2) continue;
        out.push({ d: toPath(pts), c: hex(useCoreColor ? coreRGB(pts) : pathRGB(pts)), w: Math.max(0.6, 2.9 * (0.85 + rnd() * 0.3) * (useScale ? detailScaleAt(x, y, 2.9) : 1)), o: 1, len: polyLen(pts), x, y });
      }
    }
    for (let gy0 = sFine * 0.45; gy0 < H; gy0 += sFine) {
      for (let gx0 = sFine * 0.45; gx0 < W; gx0 += sFine) {
        const x = gx0 + (rnd() - 0.5) * 1.5, y = gy0 + (rnd() - 0.5) * 1.5;
        const xi = x | 0, yi = y | 0;
        if (xi < 1 || yi < 1 || xi >= W - 1 || yi >= H - 1 || !focus[yi * W + xi]) continue;
        if (D[yi * W + xi] < P[72]) continue; // second pass only on real edges
        const pts = walk(x, y, 3 + rnd() * 2, 1.5);
        if (pts.length < 2) continue;
        out.push({ d: toPath(pts), c: hex(useCoreColor ? coreRGB(pts) : pathRGB(pts)), w: Math.max(0.6, 1.7 * (useScale ? detailScaleAt(x, y, 1.7) : 1)), o: 1, len: polyLen(pts), x, y });
      }
    }
    return out;
  }
  {
    let sCoarse = 2.6, sFine = 2.2;
    let l4 = buildFocusStrokes(sCoarse, sFine);
    if (l4.length > L4_CAP) {
      const f = Math.sqrt(l4.length / L4_CAP);
      sCoarse *= f; sFine *= f;
      say(`focus layer would be ${l4.length} strokes — coarsening spacing to ${sCoarse.toFixed(1)}px`);
      l4 = buildFocusStrokes(sCoarse, sFine);
    }
    layers[4] = l4;
  }

  // ---- L5: specular points / stars ----
  {
    const out = layers[5];
    const cand = new Uint8Array(N);
    const Lm = box(L, 4);
    for (let i = 0; i < N; i++) if (L[i] > 0.52 && Lm[i] < 0.32) cand[i] = 1;
    const seen = new Uint8Array(N);
    for (let s = 0; s < N; s++) {
      if (!cand[s] || seen[s]) continue;
      const comp = [s]; seen[s] = 1;
      for (let k = 0; k < comp.length; k++) {
        const i = comp[k], x = i % W, y = (i / W) | 0;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
          const j = ny * W + nx;
          if (cand[j] && !seen[j]) { seen[j] = 1; comp.push(j); }
        }
      }
      let cx = 0, cy = 0;
      for (const i of comp) { cx += i % W; cy += (i / W) | 0; }
      cx /= comp.length; cy /= comp.length;
      const a = rnd() * Math.PI;
      const pts = [[cx - Math.cos(a), cy - Math.sin(a)], [cx + Math.cos(a), cy + Math.sin(a)]];
      out.push({ d: toPath(pts), c: hex(discRGB(cx, cy, 1)), w: Math.min(3.5, 1.2 + comp.length * 0.35), o: 1, len: 2, x: cx, y: cy });
    }
  }
  say(`analysis · skin ${(skinFrac * 100).toFixed(1)}% · focus ${(focusFrac * 100).toFixed(1)}% (${skinPrimary ? 'face-led' : 'detail-led'})`);

  // ---- layer names ----
  const DEFAULT_NAMES = [
    'L0 大色块铺底', 'L1 中间调塑形', 'L2 细部肌理', 'L3 线稿轮廓',
    skinPrimary && skinFrac > 0.02 ? 'L4 五官与手' : 'L4 焦点密集笔', 'L5 高光星点',
  ];
  let names = DEFAULT_NAMES;
  if (opts.names) {
    const given = String(opts.names).split('|').map(s => s.trim());
    names = DEFAULT_NAMES.map((d, i) => {
      if (!given[i]) return d;
      return /^L\d/.test(given[i]) ? given[i] : 'L' + i + ' ' + given[i];
    });
  }

  // ---- order + strictly serial timeline ----
  const strokes = [];
  for (let li = 0; li <= MAXL; li++) {
    const arr = layers[li];
    arr.sort((a, b) => {
      const ba = (a.y / 96) | 0, bb = (b.y / 96) | 0;
      if (ba !== bb) return ba - bb;
      return ba % 2 ? b.x - a.x : a.x - b.x; // serpentine sweep, like a real brush hand
    });
    for (const s of arr) strokes.push({ ...s, li });
  }
  if (!strokes.length) throw new Error('no strokes were generated — is the image blank?');

  // Scale stroke durations to the requested length. A floor keeps single strokes
  // visible (a 0ms path reads as a jump), and the scale factor is re-solved so the
  // floors never inflate the total past the request.
  const base = s => Math.max(0.02, s.len / LAYER_SPEED[s.li]);
  const MIN_DUR = 0.0015;
  let raw = 0;
  for (const s of strokes) raw += base(s);
  let k = seconds / raw;
  for (let iter = 0; iter < 12; iter++) {
    let sum = 0;
    for (const s of strokes) sum += Math.max(MIN_DUR, base(s) * k);
    const nk = seconds / sum;
    if (Math.abs(nk - k) < 1e-7) break;
    k = nk;
  }
  let atFloor = 0;
  // integer ticks (0.1 ms) so the serial timeline carries no float drift
  const TICK = 1e4;
  let tick = 0;
  const data = strokes.map(s => {
    const dur = Math.max(MIN_DUR, base(s) * k);
    if (dur === MIN_DUR) atFloor++;
    const dt = Math.max(1, Math.round(dur * TICK));
    const rec = [s.d, s.c, +s.w.toFixed(2), s.o, tick / TICK, dt / TICK, s.li];
    tick += dt;
    return rec;
  });
  const TOTAL = tick / TICK;
  if (atFloor > data.length * 0.5) {
    say(`${atFloor} of ${data.length} strokes sit at the minimum visible length — fewer layers or a smaller width gives a calmer pace.`);
  }
  for (let i = 1; i < data.length; i++) {
    if (Math.abs(data[i][4] - (data[i - 1][4] + data[i - 1][5])) > 1e-9) throw new Error('timeline overlap at ' + i);
  }
  const counts = layers.slice(0, MAXL + 1).map(a => a.length);

  return {
    packet: { w: W, h: H, total: TOTAL, names, strokes: data },
    meta: {
      analysis: [W, H], strokes: data.length, seconds: TOTAL, layers: counts,
      names, maxLayer: MAXL, width: opts.width || 640,
    },
    counts, skinFrac, focusFrac, skinPrimary,
  };
}

if (typeof module === 'object' && module.exports) module.exports = { paintCore, resizeRGBA, LAYER_SPEED };

{padding:8px 12px 6px;color:var(--mut);white-space:pre;overflow:hidden;border-bottom:1px dashed var(--line)}\n  #cstat{padding:6px 12px;color:var(--acc);white-space:pre;overflow:hidden;border-bottom:1px solid var(--line)}\n  #log{flex:1;overflow:auto;padding:4px 0}\n  .cl{padding:1px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#4A4C44}\n  .cl .ci{color:#B0B2A6;user-select:none}\n  .cf{color:var(--acc);font-weight:600}\n  .ch{font-weight:600;color:#3C3E36}\n  .ch i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;border:1px solid rgba(0,0,0,.18)}\n  .cn{color:#8A6A12}\n  .cd{color:#3E6B4F}\n  .cc{padding:7px 12px 1px;color:#9A9C90;font-style:italic}\n  .cl.now{background:#fff;box-shadow:inset 2px 0 0 var(--acc)}\n  .cl.fut{opacity:.4}\n  @media (max-width:1100px){main{flex-direction:column;overflow:auto}.side{width:100%}.codecard{min-height:260px}}\n</style></head><body>\n<div class=\"page\">\n<header><div class=\"brand\">__BRAND__<span class=\"sub\">__SUB__</span></div><div class=\"meta\" id=\"meta\"></div></header>\n<main>\n  <section class=\"board\">\n    <div class=\"paper\"><div class=\"canvas\" id=\"canvas\"><svg id=\"svg\" xmlns=\"http://www.w3.org/2000/svg\"></svg></div></div>\n    <div class=\"cap\"><span id=\"capL\"></span><span id=\"capR\"></span></div>\n  </section>\n  <aside class=\"side\">\n    <div class=\"card orig\"><img alt=\"原图\" src=\"__ORIGINAL__\"></div>\n    <div class=\"card ctl\">\n      <div class=\"row1\"><span id=\"cnt\">00000</span><span class=\"den\">/ <span id=\"den\"></span> 笔</span><span id=\"tm\"></span></div>\n      <input id=\"seek\" type=\"range\" min=\"0\" max=\"1\" step=\"0.001\" value=\"0\">\n      <div class=\"row2\">\n        <button id=\"bPrev\" class=\"rb\" title=\"上一笔 (←)\">⏮</button>\n        <button id=\"bPlay\" class=\"rb big\" title=\"播放/暂停 (空格)\">▶</button>\n        <button id=\"bNext\" class=\"rb\" title=\"下一笔 (→)\">⏭</button>\n        <span class=\"sps\">\n          <button class=\"sb\" data-v=\"0.5\">0.5x</button><button class=\"sb on\" data-v=\"1\">1x</button><button class=\"sb\" data-v=\"2\">2x</button><button class=\"sb\" data-v=\"4\">4x</button><button class=\"sb\" data-v=\"8\">8x</button>\n        </span>\n      </div>\n      <div class=\"layers\" id=\"layers\"></div>\n    </div>\n    <div class=\"card codecard\">\n      <div class=\"codehead\"><span>CODE · BRUSH LOG</span><button id=\"bCode\" class=\"chip\">隐藏</button></div>\n      <div id=\"chead\"></div>\n      <div id=\"cstat\"></div>\n      <div id=\"log\"></div>\n    </div>\n  </aside>\n</main>\n</div>\n<script>\nconst PK = __PACKET__;\nconst W = PK.w, H = PK.h, TOTAL = PK.total, S = PK.strokes, NS = S.length, NAMES = PK.names;\ndocument.getElementById('meta').textContent = 'SVG PATH · ' + NS.toLocaleString() + ' STROKES · ' + W + ' × ' + H;\nconst svg = document.getElementById('svg');\nsvg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);\n// fit the artwork into the paper box at its own aspect ratio (portrait or landscape)\nconst canvasEl = document.getElementById('canvas');\nfunction fit() {\n  const aw = canvasEl.clientWidth, ah = canvasEl.clientHeight;\n  if (!aw || !ah) return;\n  const s = Math.min(aw / W, ah / H);\n  svg.style.width = Math.max(1, Math.round(W * s)) + 'px';\n  svg.style.height = Math.max(1, Math.round(H * s)) + 'px';\n}\nif (window.ResizeObserver) new ResizeObserver(fit).observe(canvasEl);\nelse addEventListener('resize', fit);\nfit();\nconst paper = document.createElementNS(svg.namespaceURI, 'rect');\npaper.setAttribute('width', W); paper.setAttribute('height', H); paper.setAttribute('fill', '#ffffff');\nsvg.appendChild(paper);\nconst P = new Array(NS);\nconst frag = document.createDocumentFragment();\nfor (let i = 0; i < NS; i++) {\n  const s = S[i], p = document.createElementNS(svg.namespaceURI, 'path');\n  p.setAttribute('d', s[0]); p.setAttribute('stroke', s[1]); p.setAttribute('stroke-width', s[2]);\n  p.setAttribute('fill', 'none'); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round');\n  p.setAttribute('stroke-opacity', s[3]);\n  p.setAttribute('pathLength', '1'); p.setAttribute('stroke-dasharray', '1'); p.setAttribute('stroke-dashoffset', '1');\n  P[i] = p; frag.appendChild(p);\n}\nsvg.appendChild(frag);\nconst chead = document.getElementById('chead'), cstat = document.getElementById('cstat'), log = document.getElementById('log');\nconst cnt = document.getElementById('cnt'), den = document.getElementById('den'), tm = document.getElementById('tm');\nconst capL = document.getElementById('capL'), capR = document.getElementById('capR');\nden.textContent = NS.toLocaleString();\n{\n  const c = {}; for (const s of S) c[s[6]] = (c[s[6]] || 0) + 1;\n  chead.textContent = 'const paper = svg(' + W + ', ' + H + ', \"#ffffff\");\\n// ' + NS + ' strokes · strictly serial · one brush at a time';\n  document.getElementById('layers').innerHTML = NAMES.map((n, i) => c[i] ? '<div class=\"ly\" data-l=\"' + i + '\"><b>' + n.slice(3) + '</b><span>' + c[i].toLocaleString() + '</span></div>' : '').join('');\n}\nconst lyEls = NAMES.map((n, i) => document.querySelector('.ly[data-l=\"' + i + '\"]'));\nlet lastCodeCur = -1, lastLy = -1;\nfunction lineHTML(i) {\n  const s = S[i];\n  return '<div class=\"cl' + (i > cur ? ' fut' : '') + (i === cur ? ' now' : '') + '\" data-i=\"' + i + '\" title=\"' + s[0] + '\"><span class=\"ci\">' + String(i).padStart(5, '0') + '</span> <span class=\"cf\">brush</span>(<span class=\"ch\"><i style=\"background:' + s[1] + '\"></i>' + s[1] + '</span>, <span class=\"cn\">' + s[2] + '</span>, <span class=\"cn\">' + s[3] + '</span>, <span class=\"cd\">\\'' + s[0] + '\\'</span>)</div>';\n}\nfunction refreshCode() {\n  if (cur === lastCodeCur) return;\n  lastCodeCur = cur;\n  const a = Math.max(0, cur - 40), b = Math.min(NS, cur + 8);\n  let h = '';\n  for (let i = a; i < b; i++) {\n    if (i === a || S[i][6] !== S[i - 1][6]) h += '<div class=\"cc\">// ── ' + NAMES[S[i][6]] + ' ──</div>';\n    h += lineHTML(i);\n  }\n  log.innerHTML = h;\n  const el = log.querySelector('.cl[data-i=\"' + cur + '\"]');\n  if (el) el.scrollIntoView({ block: 'center' });\n}\nconst seek = document.getElementById('seek');\nconst bPlay = document.getElementById('bPlay'), bPrev = document.getElementById('bPrev'), bNext = document.getElementById('bNext');\nseek.max = TOTAL;\nlet t = 0, cur = 0, playing = false, speed = 1, lastTs = null, scrubbing = false;\nconst mmss = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');\nconst endOf = i => S[i][4] + S[i][5];\nfunction setOff(i, v) { P[i].setAttribute('stroke-dashoffset', v); }\nfunction applyFull(nt) {\n  for (let i = 0; i < NS; i++) setOff(i, nt >= endOf(i) ? 0 : nt >= S[i][4] ? 1 - (nt - S[i][4]) / S[i][5] : 1);\n  let lo = 0, hi = NS; while (lo < hi) { const m = (lo + hi) >> 1; if (endOf(m) <= nt) lo = m + 1; else hi = m; }\n  cur = lo;\n}\nfunction applyFwd(nt) {\n  while (cur < NS && endOf(cur) <= nt) { setOff(cur, 0); cur++; }\n  if (cur < NS) setOff(cur, nt >= S[cur][4] ? 1 - (nt - S[cur][4]) / S[cur][5] : 1);\n}\nfunction setTime(nt, forceFull) {\n  nt = Math.max(0, Math.min(TOTAL, nt));\n  if (forceFull || nt < t) applyFull(nt); else applyFwd(nt);\n  t = nt; hud();\n}\nfunction hud() {\n  if (!scrubbing) seek.value = t;\n  cnt.textContent = String(Math.min(NS, cur + 1)).padStart(5, '0');\n  tm.textContent = mmss(t) + ' / ' + mmss(TOTAL);\n  const s = S[Math.min(cur, NS - 1)], li = s[6];\n  if (li !== lastLy) {\n    lastLy = li;\n    capL.innerHTML = '<i>●</i>' + NAMES[li].slice(3);\n    capR.textContent = 'LAYER 0' + (li + 1) + ' · ' + NAMES[li].slice(3);\n    lyEls.forEach((el, k) => el && el.classList.toggle('on', k === li));\n  }\n  const p = cur < NS ? Math.round(100 * Math.min(1, Math.max(0, (t - s[4]) / s[5]))) : 100;\n  cstat.textContent = (playing ? '▶ executing' : '⏸ paused') + '  #' + cur + '  ' + NAMES[li] + '  ' + p + '%';\n  refreshCode();\n}\nlet rafId = 0;\nfunction frame(ts) {\n  if (playing) {\n    if (lastTs != null) {\n      t += (ts - lastTs) / 1000 * speed;\n      if (t >= TOTAL) { t = TOTAL; playing = false; bPlay.textContent = '▶'; }\n      applyFwd(t); hud();\n    }\n    lastTs = ts;\n  } else lastTs = ts;\n  rafId = requestAnimationFrame(frame);\n}\nbPlay.onclick = () => {\n  if (!playing && t >= TOTAL) setTime(0, true);\n  playing = !playing; bPlay.textContent = playing ? '⏸' : '▶';\n};\nseek.addEventListener('pointerdown', () => scrubbing = true);\naddEventListener('pointerup', () => scrubbing = false);\nseek.addEventListener('input', () => setTime(parseFloat(seek.value), false));\nfunction lowerStart(nt) { let lo = 0, hi = NS; while (lo < hi) { const m = (lo + hi) >> 1; if (S[m][4] < nt - 1e-6) lo = m + 1; else hi = m; } return lo - 1; }\nfunction upperStart(nt) { let lo = 0, hi = NS; while (lo < hi) { const m = (lo + hi) >> 1; if (S[m][4] <= nt + 1e-6) lo = m + 1; else hi = m; } return lo; }\nbPrev.onclick = () => { const i = lowerStart(t); setTime(i >= 0 ? S[i][4] : 0, true); };\nbNext.onclick = () => { const i = upperStart(t); setTime(i < NS ? S[i][4] : TOTAL, true); };\ndocument.querySelectorAll('.sb').forEach(b => b.onclick = () => {\n  speed = parseFloat(b.dataset.v);\n  document.querySelectorAll('.sb').forEach(x => x.classList.toggle('on', x === b));\n});\n// clicking a layer chip jumps to the frame where that layer is finished\ndocument.querySelectorAll('.ly').forEach(el => el.onclick = () => {\n  const lv = +el.dataset.l;\n  let last = -1;\n  for (let i = 0; i < NS; i++) if (S[i][6] <= lv) last = i; else if (last >= 0) break;\n  setTime(last >= 0 ? endOf(last) : 0, true);\n});\nconst bCode = document.getElementById('bCode');\nbCode.onclick = () => { const off = document.body.classList.toggle('nocode'); bCode.textContent = off ? '显示' : '隐藏'; };\naddEventListener('keydown', e => {\n  if (e.code === 'Space') { e.preventDefault(); bPlay.onclick(); }\n  else if (e.key === 'A const PRESETS = { quick: { width: 440, layers: 3 }, normal: { width: 640, layers: 5 }, fine: { width: 820, layers: 5 } };

const $ = s => document.querySelector(s);
const tick = () => new Promise(r => setTimeout(r, 24));
// three mutually exclusive screens: picker / spinner / result
function showPicker() { $('#stage').hidden = false; $('#input').hidden = false; $('#busy').hidden = true; $('#out').hidden = true; }
function showBusy() { $('#stage').hidden = false; $('#input').hidden = true; $('#busy').hidden = false; $('#out').hidden = true; }
function showResult() { $('#stage').hidden = true; $('#out').hidden = false; }

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fill = (tpl, map) => Object.keys(map).reduce((s, k) => s.split(k).join(map[k]), tpl);
const safeJson = v => JSON.stringify(v).replace(/<\//g, '<\\/');

let currentHtml = '';
let currentName = 'paint';

// ---- decode any browser-supported image into an RGBA raster ----
function rasterFrom(bitmap) {
  const MAX = 2000; // cap the working raster; the analysis is 640 wide anyway
  const s = Math.min(1, MAX / Math.max(bitmap.width, bitmap.height));
  const w = Math.max(1, Math.round(bitmap.width * s));
  const h = Math.max(1, Math.round(bitmap.height * s));
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bitmap, 0, 0, w, h);
  const data = ctx.getImageData(0, 0, w, h).data; // Uint8ClampedArray, RGBA
  return { rgba: data, w, h, canvas: cv };
}

function thumbDataUrl(canvas) {
  const s = Math.min(1, 520 / canvas.height);
  const w = Math.max(1, Math.round(canvas.width * s));
  const h = Math.max(1, Math.round(canvas.height * s));
  const c2 = document.createElement('canvas');
  c2.width = w; c2.height = h;
  const x = c2.getContext('2d');
  x.fillStyle = '#ffffff';                       // JPEG has no alpha: keep paper white
  x.fillRect(0, 0, w, h);
  x.imageSmoothingQuality = 'high';
  x.drawImage(canvas, 0, 0, w, h);
  return c2.toDataURL('image/jpeg', 0.82);
}

function buildPlayer(packet, imageUrl, title, sub) {
  return fill(PLAYER_TPL, {
    '__PACKET__': safeJson(packet),
    '__ORIGINAL__': imageUrl,
    '__BRAND__': esc(title),
    '__SUB__': esc(sub),
  });
}

// ---- the one-click path ----
async function paintFromBlob(blob, name) {
  currentName = (name || 'image').replace(/\.[^.]+$/, '').replace(/[^\w\u4e00-\u9fa5-]+/g, '-').slice(0, 40) || 'paint';
  showBusy();
  const status = $('#status');
  status.classList.remove('err');
  try {
    status.textContent = '读取图片…';
    await tick();
    let bitmap;
    try {
      bitmap = await createImageBitmap(blob);
    } catch (e) {
      throw new Error('这个格式浏览器读不了，换一张 JPG / PNG / WebP 试试');
    }
    const src = rasterFrom(bitmap);
    if (bitmap.close) bitmap.close();

    const preset = PRESETS[$('#preset').value] || PRESETS.normal;
    const seconds = +$('#seconds').value || 100;
    const title = ($('#title').value || '一笔一画').trim();

    status.textContent = `分析画面（${src.w}×${src.h}）…`;
    await tick();

    const t0 = performance.now();
    const res = paintCore({
      rgba: src.rgba, srcW: src.w, srcH: src.h,
      width: preset.width, layers: preset.layers, seconds,
      log: m => { status.textContent = m; },
    });
    const ms = Math.round(performance.now() - t0);

    status.textContent = '生成画面…';
    await tick();
    const html = buildPlayer(res.packet, thumbDataUrl(src.canvas), title, 'STROKE STUDY');
    currentHtml = html;

    const size = new Blob([html]).size;
    $('#stats').textContent =
      `${res.packet.strokes.length.toLocaleString()} 笔 · ${res.packet.total.toFixed(0)} 秒 · ` +
      `${(size / 1048576).toFixed(1)} MB · ${ms} ms`;
    // the downloadable file stays paused at frame 0; the preview starts playing itself
    const autoplay = '<script>setTimeout(function(){var b=document.getElementById("bPlay");' +
      'if(b&&b.textContent.indexOf("\u25b6")>-1)b.click();},400);<\/script>';
    $('#frame').srcdoc = html.replace('</body>', autoplay + '</body>');
    showResult();
  } catch (e) {
    status.classList.add('err');
    status.textContent = '出错了：' + (e && e.message ? e.message : e);
  }
}

// fetch() of a data: URL fails on file:// pages, so decode the sample by hand
function b64ToBlob(b64, type) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: type || 'image/jpeg' });
}

// ---- input wiring ----
function handleFile(file) {
  if (!file) return;
  if (!/^image\//.test(file.type)) {
    showBusy();
    const s = $('#status');
    s.classList.add('err');
    s.textContent = '这不是图片文件（' + (file.type || '未知类型') + '）';
    return;
  }
  paintFromBlob(file, file.name);
}

$('#file').addEventListener('change', e => handleFile(e.target.files[0]));

const drop = $('#drop');
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => {
  e.preventDefault(); e.stopPropagation(); drop.classList.add('over');
}));
['dragleave', 'dragend'].forEach(t => drop.addEventListener(t, e => {
  e.preventDefault(); drop.classList.remove('over');
}));
drop.addEventListener('drop', e => {
  e.preventDefault(); e.stopPropagation(); drop.classList.remove('over');
  handleFile(e.dataTransfer.files && e.dataTransfer.files[0]);
});
// dropping anywhere on the page also works
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  if (e.target.closest && e.target.closest('#drop')) return;
  e.preventDefault();
  handleFile(e.dataTransfer.files && e.dataTransfer.files[0]);
});

window.addEventListener('paste', e => {
  const items = (e.clipboardData && e.clipboardData.items) || [];
  for (const it of items) {
    if (it.type && it.type.indexOf('image/') === 0) {
      handleFile(it.getAsFile());
      e.preventDefault();
      return;
    }
  }
});

$('#demo').addEventListener('click', () => {
  if (!SAMPLE) return;
  showBusy();
  $('#status').textContent = '加载示例图…';
  try {
    paintFromBlob(b64ToBlob(SAMPLE, 'image/jpeg'), 'sample.jpg');
  } catch (e) {
    $('#status').classList.add('err');
    $('#status').textContent = '示例图加载失败：' + e.message;
  }
});

$('#dl').addEventListener('click', () => {
  if (!currentHtml) return;
  const blob = new Blob([currentHtml], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = currentName + '.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
});

$('#again').addEventListener('click', () => {
  $('#frame').removeAttribute('srcdoc');
  currentHtml = '';
  $('#status').classList.remove('err');
  $('#status').textContent = '读取图片…';
  showPicker();
});

// ---- optional deep links: #demo runs the sample, ?src=<url> paints a remote image ----
(function deepLinks() {
  if (/demo/.test(location.hash)) {
    setTimeout(() => $('#demo').click(), 60);
    return;
  }
  const src = new URLSearchParams(location.search).get('src');
  if (src && /^https?:/i.test(src) && /^https?:/.test(location.protocol)) {
    (async () => {
      showBusy();
      $('#status').textContent = '下载图片…';
      try {
        const blob = await (await fetch(src)).blob();
        paintFromBlob(blob, src.split('/').pop() || 'image');
      } catch (e) {
        $('#status').classList.add('err');
        $('#status').textContent = '图片下载失败（可能是跨域限制）：' + e.message;
      }
    })();
  }
})();
</script>
